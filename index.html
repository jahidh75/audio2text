<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Engine Audio to Text</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .box { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; margin-bottom: 5px; color: #222; font-size: 22px; }
        p.sub { text-align: center; font-size: 13px; color: #666; margin-bottom: 18px; }
        
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: #444; font-weight: 600; }
        input[type="file"], select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; outline: none; background: #fff; }

        audio { width: 100%; margin-top: 10px; }

        textarea { width: 100%; height: 180px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; line-height: 1.6; resize: none; outline: none; margin-top: 12px; }
        textarea:focus { border-color: #007bff; }

        .btn-start { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; background: #28a745; color: white; margin: 15px 0 10px 0; transition: 0.2s; }
        .btn-start:hover { background: #218838; }

        .btn-action { display: flex; gap: 10px; margin-top: 10px; }
        .btn-action button { flex: 1; background: #6c757d; color: white; font-size: 13px; padding: 10px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-action button:hover { background: #5a6268; }

        #status { font-size: 13px; text-align: center; margin: 10px 0; font-weight: 600; color: #0c5460; }
        .tip { background: #e7f5ff; border: 1px solid #a5d8ff; padding: 10px; border-radius: 6px; font-size: 12px; color: #1971c2; line-height: 1.4; }
    </style>
</head>
<body>

<div class="box">
    <h2>Google Engine Audio to Text</h2>
    <p class="sub">গুগলের নির্ভুল বাংলা স্পিচ ইঞ্জিন ব্যবহার করে অডিও থেকে টেক্সট</p>

    <div class="field">
        <label for="audioInput">অডিও ফাইল সিলেক্ট করুন:</label>
        <input type="file" id="audioInput" accept="audio/*" />
        <audio id="player" controls></audio>
    </div>

    <div class="field">
        <label for="lang">ভাষা:</label>
        <select id="lang">
            <option value="bn-BD" selected>🇧🇩 বাংলা (বাংলাদেশ)</option>
            <option value="bn-IN">🇮🇳 বাংলা (ভারত)</option>
            <option value="en-US">🇺🇸 English</option>
        </select>
    </div>

    <button id="runBtn" class="btn-start" onclick="startAudioTranscribe()">▶️ অডিও চালান ও টেক্সট তুলুন</button>
    <div id="status">অডিও ফাইল নির্বাচন করুন</div>

    <textarea id="result" placeholder="গুগল ইঞ্জিন দিয়ে নিখুঁত টেক্সট এখানে আসবে..."></textarea>

    <div class="btn-action">
        <button onclick="copyText()">📋 কপি করুন</button>
        <button onclick="downloadText()">⬇️ টেক্সট সেভ করুন</button>
        <button onclick="clearText()">🗑️ মুছুন</button>
    </div>

    <div class="tip" style="margin-top: 15px;">
        💡 <strong>ভালো ফলাফলের নিয়ম:</strong> আপনার স্পিকারের সাউন্ড স্বাভাবিক রাখুন যাতে মাইক স্পষ্ট শুনতে পারে (অথবা পিসিতে 'Stereo Mix' অন থাকলে হেডফোন ছাড়াই ইন্টারনালি সরাসরি লিখে নেবে)।
    </div>
</div>

<script>
    const audioInput = document.getElementById('audioInput');
    const player = document.getElementById('player');
    const langSelect = document.getElementById('lang');
    const resultArea = document.getElementById('result');
    const statusText = document.getElementById('status');
    const runBtn = document.getElementById('runBtn');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let finalTranscript = '';
    let isProcessing = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onresult = function(event) {
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    const text = event.results[i][0].transcript.trim();
                    if (text) {
                        if (finalTranscript.length > 0 && !finalTranscript.endsWith(' ')) {
                            finalTranscript += ' ';
                        }
                        finalTranscript += text;
                    }
                }
            }
            resultArea.value = finalTranscript;
            resultArea.scrollTop = resultArea.scrollHeight;
        };

        recognition.onend = function() {
            if (isProcessing && !player.paused) {
                try { recognition.start(); } catch(e) {}
            }
        };
    }

    audioInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            player.src = URL.createObjectURL(file);
            statusText.innerText = 'অডিও প্রস্তুত! বাটনে চাপুন।';
        }
    });

    player.onended = function() {
        isProcessing = false;
        if (recognition) recognition.stop();
        statusText.innerText = '✅ অডিও শেষ ও ট্রান্সক্রিপশন সম্পন্ন!';
        runBtn.disabled = false;
    };

    function startAudioTranscribe() {
        if (!player.src) return alert('আগে একটি অডিও ফাইল সিলেক্ট করুন!');
        if (!recognition) return alert('আপনার ব্রাউজারে গুগল স্পিচ সাপোর্ট নেই। Chrome ব্যবহার করুন।');

        isProcessing = true;
        runBtn.disabled = true;
        statusText.innerText = 'অডিও প্লে হচ্ছে এবং গুগল ইঞ্জিন দিয়ে টেক্সট লেখা হচ্ছে...';

        recognition.lang = langSelect.value;
        finalTranscript = resultArea.value;

        try { recognition.start(); } catch(e) {}
        player.play();
    }

    function copyText() {
        if (!resultArea.value.trim()) return alert('কপি করার মতো টেক্সট নেই!');
        navigator.clipboard.writeText(resultArea.value);
        alert('টেক্সট কপি করা হয়েছে!');
    }

    function downloadText() {
        const text = resultArea.value.trim();
        if (!text) return alert('ডাউনলোড করার মতো টেক্সট নেই!');
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `audio_transcription_${Date.now()}.txt`;
        link.click();
    }

    function clearText() {
        finalTranscript = '';
        resultArea.value = '';
    }
</script>

</body>
</html>

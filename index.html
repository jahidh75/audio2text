<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Audio to Text Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .box { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; margin-bottom: 5px; color: #222; font-size: 22px; }
        p.sub { text-align: center; font-size: 13px; color: #666; margin-bottom: 18px; }
        
        .field { margin-bottom: 14px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: #444; font-weight: 600; }
        input[type="file"], select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; outline: none; background: #fff; }

        audio { width: 100%; margin-top: 8px; }

        textarea { width: 100%; height: 180px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; line-height: 1.6; resize: none; outline: none; margin-top: 10px; }
        textarea:focus { border-color: #007bff; }

        .btn-controls { display: flex; gap: 10px; margin: 15px 0 10px 0; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        
        .btn-start { background: #28a745; color: white; }
        .btn-start:hover { background: #218838; }
        .btn-stop { background: #dc3545; color: white; display: none; }
        .btn-stop:hover { background: #c82333; }

        .btn-action { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-action button { background: #6c757d; color: white; font-size: 12px; padding: 10px 4px; border-radius: 6px; }
        .btn-action button:hover { background: #5a6268; }

        #status { font-size: 13px; text-align: center; margin: 8px 0; font-weight: 600; color: #0c5460; }
        .listening { color: #dc3545 !important; }
    </style>
</head>
<body>

<div class="box">
    <h2>Google Engine Audio to Text</h2>
    <p class="sub">গুগলের নির্ভুল বাংলা ইঞ্জিনে অডিও ফাইল ট্রান্সক্রিপশন</p>

    <div class="field">
        <label for="audioInput">অডিও ফাইল সিলেক্ট করুন:</label>
        <input type="file" id="audioInput" accept="audio/*" />
        <audio id="player" controls></audio>
    </div>

    <div class="field">
        <label for="lang">ভাষা:</label>
        <select id="lang">
            <option value="bn-BD" selected>🇧🇩 বাংলা (বাংলাদেশ)</option>
            <option value="bn-IN">🇮🇳 বাংলা (ভারত)</option>
            <option value="en-US">🇺🇸 English</option>
        </select>
    </div>

    <div class="btn-controls">
        <button id="runBtn" class="btn-start" onclick="startAudioTranscribe()">▶️ শুরু করুন</button>
        <button id="stopBtn" class="btn-stop" onclick="stopAudioTranscribe()">⏹️ বন্ধ করুন</button>
    </div>

    <div id="status">একটি অডিও ফাইল নির্বাচন করুন</div>

    <textarea id="result" placeholder="ট্রান্সক্রিপ্ট করা টেক্সট এখানে একের পর এক উঠবে..."></textarea>

    <div class="btn-action">
        <button onclick="copyText()">📋 কপি করুন</button>
        <button onclick="downloadText()">⬇️ টেক্সট সেভ</button>
        <button onclick="clearText()">🗑️ মুছুন</button>
    </div>
</div>

<script>
    const audioInput = document.getElementById('audioInput');
    const player = document.getElementById('player');
    const langSelect = document.getElementById('lang');
    const resultArea = document.getElementById('result');
    const statusText = document.getElementById('status');
    const runBtn = document.getElementById('runBtn');
    const stopBtn = document.getElementById('stopBtn');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let finalTranscript = '';
    let isProcessing = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false; // মিসিং ও ডুপ্লিকেট রোধ করার জন্য

        recognition.onresult = function(event) {
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    const word = event.results[i][0].transcript.trim();
                    if (word) {
                        if (finalTranscript.length > 0 && !finalTranscript.endsWith(' ')) {
                            finalTranscript += ' ';
                        }
                        finalTranscript += word;
                    }
                }
            }
            resultArea.value = finalTranscript;
            resultArea.scrollTop = resultArea.scrollHeight;
        };

        recognition.onerror = function(event) {
            // সাইলেন্স এরর হলে নিজে রিস্টার্ট করবে
            if (event.error === 'no-speech' && isProcessing) {
                try { recognition.start(); } catch(e) {}
            }
        };

        recognition.onend = function() {
            // অডিও চলাকালীন ব্রাউজার নিজে থেকে থামলে আবার রিস্টার্ট করা
            if (isProcessing) {
                try { recognition.start(); } catch(e) {}
            }
        };
    }

    audioInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            player.src = URL.createObjectURL(file);
            statusText.innerText = 'অডিও প্রস্তুত! "শুরু করুন" চাপুন।';
            statusText.classList.remove('listening');
        }
    });

    player.onended = function() {
        stopAudioTranscribe();
        statusText.innerText = '✅ অডিও শেষ ও লেখা সম্পন্ন!';
    };

    function startAudioTranscribe() {
        if (!player.src) return alert('অনুগ্রহ করে আগে একটি অডিও ফাইল বেছে নিন!');
        if (!recognition) return alert('Chrome ব্রাউজার ব্যবহার করুন।');

        isProcessing = true;
        runBtn.style.display = 'none';
        stopBtn.style.display = 'block';
        statusText.innerText = '🔴 অডিও চলছে এবং গুগল ইঞ্জিন শুনছে...';
        statusText.classList.add('listening');

        recognition.lang = langSelect.value;
        finalTranscript = resultArea.value.trim();

        try { recognition.start(); } catch(e) {}
        player.play();
    }

    function stopAudioTranscribe() {
        isProcessing = false;
        player.pause();
        if (recognition) {
            try { recognition.stop(); } catch(e) {}
        }
        runBtn.style.display = 'block';
        stopBtn.style.display = 'none';
        statusText.innerText = '⏹️ থামানো হয়েছে।';
        statusText.classList.remove('listening');
    }

    function copyText() {
        if (!resultArea.value.trim()) return alert('কপি করার মতো টেক্সট নেই!');
        navigator.clipboard.writeText(resultArea.value);
        alert('টেক্সট কপি করা হয়েছে!');
    }

    function downloadText() {
        const text = resultArea.value.trim();
        if (!text) return alert('ডাউনলোড করার মতো টেক্সট নেই!');
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `audio_transcript_${Date.now()}.txt`;
        link.click();
    }

    function clearText() {
        finalTranscript = '';
        resultArea.value = '';
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio to Text Converter Pro (Accurate)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .box { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 520px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; margin-bottom: 5px; color: #222; font-size: 22px; }
        p.sub { text-align: center; font-size: 13px; color: #666; margin-bottom: 20px; }
        
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: #444; font-weight: 600; }
        input[type="file"], select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; outline: none; background: #fff; }

        textarea { width: 100%; height: 200px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; line-height: 1.6; resize: none; outline: none; }
        textarea:focus { border-color: #007bff; }

        .btn-transcribe { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; background: #28a745; color: white; margin: 15px 0 10px 0; transition: 0.2s; }
        .btn-transcribe:hover { background: #218838; }
        .btn-transcribe:disabled { background: #6c757d; cursor: not-allowed; }

        .btn-action { display: flex; gap: 10px; margin-top: 10px; }
        .btn-action button { flex: 1; background: #6c757d; color: white; font-size: 13px; padding: 10px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-action button:hover { background: #5a6268; }

        #status { font-size: 13px; text-align: center; margin: 10px 0; font-weight: 600; color: #0c5460; }
    </style>
</head>
<body>

<div class="box">
    <h2>Audio to Text Converter</h2>
    <p class="sub">Whisper AI দিয়ে নির্ভুল বাংলা ট্রান্সক্রিপশন</p>

    <div class="field">
        <label for="audioFile">অডিও ফাইল সিলেক্ট করুন (mp3, wav, m4a):</label>
        <input type="file" id="audioFile" accept="audio/*" />
    </div>

    <div class="field">
        <label for="lang">ভাষা (Language):</label>
        <select id="lang">
            <option value="bn" selected>🇧🇩 বাংলা (Bangla)</option>
            <option value="en">🇺🇸 English</option>
        </select>
    </div>

    <button id="transcribeBtn" class="btn-transcribe" onclick="transcribeAudio()">নিখুঁত টেক্সটে রূপান্তর করুন</button>
    <div id="status">অডিও ফাইল নির্বাচন করুন</div>

    <textarea id="output" placeholder="সঠিক ট্রান্সক্রিপ্ট করা টেক্সট এখানে প্রদর্শিত হবে..."></textarea>

    <div class="btn-action">
        <button onclick="copyOutput()">📋 কপি করুন</button>
        <button onclick="downloadOutput()">⬇️ টেক্সট ফাইল সেভ করুন</button>
    </div>
</div>

<script>
    const GROQ_API_KEY = "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";

    const audioFileInput = document.getElementById('audioFile');
    const langSelect = document.getElementById('lang');
    const transcribeBtn = document.getElementById('transcribeBtn');
    const statusText = document.getElementById('status');
    const outputArea = document.getElementById('output');

    async function transcribeAudio() {
        const file = audioFileInput.files[0];
        const selectedLang = langSelect.value;

        if (!file) {
            alert('অনুগ্রহ করে একটি অডিও ফাইল সিলেক্ট করুন!');
            return;
        }

        if (file.size > 25 * 1024 * 1024) {
            alert('ফাইলের সাইজ ২৫ MB এর নিচে হতে হবে!');
            return;
        }

        transcribeBtn.disabled = true;
        statusText.innerText = 'অডিও প্রসেস ও বিশ্লেষণ হচ্ছে... অপেক্ষা করুন';

        const formData = new FormData();
        formData.append('file', file);
        formData.append('model', 'whisper-large-v3');
        formData.append('language', selectedLang);
        
        // মডেলের কল্পনা রোধ করে নির্ভুল ফলাফল পাওয়ার জন্য temperature 0 করা হলো
        formData.append('temperature', '0');

        // বাংলা বানান ও বাক্যের গঠন নির্ভুল করার জন্য গাইড প্রম্পট
        if (selectedLang === 'bn') {
            formData.append('prompt', 'এটি একটি স্পষ্ট বাংলা কথোপকথন বা অডিও রেকর্ডিং। যথাযথ যতিচিহ্ন ও শুদ্ধ বাংলা বানান ব্যবহার করুন।');
        }

        try {
            const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${GROQ_API_KEY}`
                },
                body: formData
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || 'সার্ভার রেসপন্স দেয়নি');
            }

            const data = await response.json();
            outputArea.value = data.text.trim();
            statusText.innerText = '✅ রূপান্তর সফল ও নির্ভুল হয়েছে!';
        } catch (err) {
            statusText.innerText = '❌ সমস্যা হয়েছে';
            alert('ত্রুটি: ' + err.message);
        } finally {
            transcribeBtn.disabled = false;
        }
    }

    function copyOutput() {
        if (!outputArea.value.trim()) return alert('কপি করার মতো টেক্সট নেই!');
        navigator.clipboard.writeText(outputArea.value);
        alert('টেক্সট কপি করা হয়েছে!');
    }

    function downloadOutput() {
        const text = outputArea.value.trim();
        if (!text) return alert('ডাউনলোড করার জন্য কোনো টেক্সট নেই!');
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `transcription_${Date.now()}.txt`;
        a.click();
    }
</script>

</body>
</html>

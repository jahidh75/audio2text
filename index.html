<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceScript AI - Audio to Text Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #090d16;
            --card-bg: rgba(22, 27, 44, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 60%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 640px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }

        /* ড্র্যাগ অ্যান্ড ড্রপ জোন */
        .dropzone {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 25px 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.08);
        }

        .dropzone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .drop-icon {
            font-size: 36px;
            margin-bottom: 8px;
            color: #818cf8;
        }

        .dropzone-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .dropzone-subtext {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* অডিও প্রিভিউ */
        .audio-preview-box {
            display: none;
            margin-top: 15px;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            align-items: center;
            gap: 12px;
        }

        .audio-preview-box.active {
            display: flex;
            flex-direction: column;
        }

        .file-details {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 12px;
            color: var(--text-muted);
        }

        .file-name {
            font-weight: 600;
            color: #e2e8f0;
            max-width: 70%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        audio {
            width: 100%;
            height: 38px;
            filter: invert(0.9) hue-rotate(180deg);
        }

        /* কন্ট্রোল গ্রিড */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin: 18px 0;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 5px;
            display: block;
        }

        select {
            width: 100%;
            padding: 11px 14px;
            background: rgba(15, 20, 35, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--primary);
        }

        /* অ্যাকশন বাটন */
        .btn-main {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-main:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-main:disabled {
            background: #334155;
            color: #64748b;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* স্ট্যাটাস ও অ্যানিমেশন */
        .status-container {
            margin: 12px 0;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            min-height: 20px;
        }

        .status-container.processing {
            color: #fbbf24;
        }

        .status-container.success {
            color: var(--success);
        }

        .status-container.error {
            color: var(--danger);
        }

        /* টেক্সট এরিয়া */
        .output-wrapper {
            position: relative;
            margin-top: 10px;
        }

        textarea {
            width: 100%;
            height: 180px;
            background: rgba(10, 14, 26, 0.7);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            font-size: 14px;
            line-height: 1.6;
            color: #e2e8f0;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: rgba(99, 102, 241, 0.4);
        }

        .bottom-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-secondary {
            flex: 1;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="badge">AI Speech Engine</span>
        <h1>VoiceScript Studio</h1>
        <p>অডিও ফাইল থেকে সরাসরি টেক্সট কনভার্টার</p>
    </div>

    <!-- ড্র্যাগ অ্যান্ড ড্রপ জোন -->
    <div class="dropzone" id="dropzone">
        <input type="file" id="audioFile" accept="audio/*" />
        <div class="drop-icon">🎧</div>
        <div class="dropzone-text" id="drop-text">এখানে অডিও ফাইল ড্রপ করুন অথবা ব্রাউজ করুন</div>
        <div class="dropzone-subtext">MP3, WAV, M4A, OGG (সর্বোচ্চ ২৫ MB)</div>
    </div>

    <!-- অডিও প্রিভিউ প্লেয়ার -->
    <div class="audio-preview-box" id="previewBox">
        <div class="file-details">
            <span class="file-name" id="fileName">audio.mp3</span>
            <span id="fileSize">0 MB</span>
        </div>
        <audio id="audioPlayer" controls></audio>
    </div>

    <div class="controls-grid">
        <div>
            <label for="langSelect">অডিওর ভাষা:</label>
            <select id="langSelect">
                <option value="bn" selected>🇧🇩 বাংলা (Bangla)</option>
                <option value="en">🇺🇸 English</option>
                <option value="auto">🌐 অটো ডিটেক্ট (Auto Detect)</option>
            </select>
        </div>
    </div>

    <button id="transcribeBtn" class="btn-main" onclick="transcribeAudio()">
        <span>⚡ টেক্সটে রূপান্তর করুন</span>
    </button>

    <div class="status-container" id="status">ফাইল নির্বাচন করে কনভার্ট চাপুন</div>

    <div class="output-wrapper">
        <textarea id="output" placeholder="ট্রান্সক্রিপ্ট করা টেক্সট এখানে প্রদর্শিত হবে..."></textarea>
    </div>

    <div class="bottom-actions">
        <button class="btn-secondary" onclick="copyOutput()">📋 কপি করুন</button>
        <button class="btn-secondary" onclick="downloadOutput()">⬇️ টেক্সট সেভ (.txt)</button>
        <button class="btn-secondary" onclick="clearOutput()">🗑️ পরিষ্কার করুন</button>
    </div>
</div>

<script>
    const GROQ_API_KEY = "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";

    const fileInput = document.getElementById('audioFile');
    const dropzone = document.getElementById('dropzone');
    const dropText = document.getElementById('drop-text');
    const previewBox = document.getElementById('previewBox');
    const audioPlayer = document.getElementById('audioPlayer');
    const fileNameDisplay = document.getElementById('fileName');
    const fileSizeDisplay = document.getElementById('fileSize');
    const langSelect = document.getElementById('langSelect');
    const transcribeBtn = document.getElementById('transcribeBtn');
    const statusText = document.getElementById('status');
    const outputArea = document.getElementById('output');

    let currentFile = null;

    // ফাইল হ্যান্ডলিং ও প্রিভিউ
    function handleFile(file) {
        if (!file) return;
        currentFile = file;

        fileNameDisplay.innerText = file.name;
        fileSizeDisplay.innerText = (file.size / (1024 * 1024)).toFixed(2) + ' MB';

        audioPlayer.src = URL.createObjectURL(file);
        previewBox.classList.add('active');
        dropText.innerText = `নির্বাচিত: ${file.name}`;

        statusText.innerText = 'অডিও প্রস্তুত! কনভার্ট বাটনে চাপুন।';
        statusText.className = 'status-container';
    }

    fileInput.addEventListener('change', (e) => {
        handleFile(e.target.files[0]);
    });

    // ড্র্যাগ অ্যান্ড ড্রপ ইভেন্ট
    dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
        dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    // API কল ও প্রসেসিং
    async function transcribeAudio() {
        if (!currentFile) {
            alert('অনুগ্রহ করে আগে একটি অডিও ফাইল নির্বাচন করুন!');
            return;
        }

        if (currentFile.size > 25 * 1024 * 1024) {
            alert('ফাইলের আকার ২৫ MB-এর নিচে হতে হবে!');
            return;
        }

        transcribeBtn.disabled = true;
        statusText.innerText = 'অডিও বিশ্লেষণ ও টেক্সট তৈরি হচ্ছে...';
        statusText.className = 'status-container processing';

        const formData = new FormData();
        formData.append('file', currentFile);
        formData.append('model', 'whisper-large-v3');
        formData.append('response_format', 'json');

        const selectedLang = langSelect.value;
        if (selectedLang !== 'auto') {
            formData.append('language', selectedLang);
        }

        try {
            const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${GROQ_API_KEY}`
                },
                body: formData
            });

            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.error?.message || 'সার্ভার সমস্যা দেখা দিয়েছে');
            }

            outputArea.value = data.text;
            statusText.innerText = '✅ রূপান্তর সফল হয়েছে!';
            statusText.className = 'status-container success';
        } catch (err) {
            statusText.innerText = '❌ রূপান্তর ব্যর্থ হয়েছে';
            statusText.className = 'status-container error';
            alert('ত্রুটি: ' + err.message);
        } finally {
            transcribeBtn.disabled = false;
        }
    }

    function copyOutput() {
        if (!outputArea.value.trim()) return alert('কপি করার মতো টেক্সট নেই!');
        navigator.clipboard.writeText(outputArea.value);
        alert('টেক্সট সফলভাবে কপি হয়েছে!');
    }

    function downloadOutput() {
        const text = outputArea.value.trim();
        if (!text) return alert('ডাউনলোড করার মতো কোনো টেক্সট নেই!');
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `transcript_${Date.now()}.txt`;
        a.click();
    }

    function clearOutput() {
        outputArea.value = '';
        statusText.innerText = 'টেক্সট ক্লিয়ার করা হয়েছে';
        statusText.className = 'status-container';
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio File to Text (Direct Cloud)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .box { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; margin-bottom: 5px; color: #222; font-size: 22px; }
        p.sub { text-align: center; font-size: 13px; color: #666; margin-bottom: 18px; }
        
        .field { margin-bottom: 14px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: #444; font-weight: 600; }
        input[type="file"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; background: #fff; }

        textarea { width: 100%; height: 200px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; line-height: 1.6; resize: none; outline: none; margin-top: 10px; }
        textarea:focus { border-color: #007bff; }

        .btn-start { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; background: #28a745; color: white; margin: 15px 0 10px 0; transition: 0.2s; }
        .btn-start:hover { background: #218838; }
        .btn-start:disabled { background: #6c757d; cursor: not-allowed; }

        .btn-action { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn-action button { background: #6c757d; color: white; font-size: 13px; padding: 10px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-action button:hover { background: #5a6268; }

        #status { font-size: 13px; text-align: center; margin: 10px 0; font-weight: 600; color: #0c5460; }
    </style>
</head>
<body>

<div class="box">
    <h2>Audio to Text Converter</h2>
    <p class="sub">সরাসরি ফাইল আপলোড করে বাংলা টেক্সট রূপান্তর</p>

    <div class="field">
        <label for="audioFile">অডিও ফাইল সিলেক্ট করুন (mp3, wav, m4a):</label>
        <input type="file" id="audioFile" accept="audio/*" />
    </div>

    <button id="btn" class="btn-start" onclick="processAudio()">টেক্সট তৈরি করুন</button>
    <div id="status">ফাইল নির্বাচন করে বাটনে চাপুন</div>

    <textarea id="output" placeholder="অডিও থেকে বের হওয়া টেক্সট এখানে আসবে..."></textarea>

    <div class="btn-action">
        <button onclick="copyText()">📋 কপি করুন</button>
        <button onclick="downloadText()">⬇️ টেক্সট সেভ</button>
    </div>
</div>

<script>
    const API_KEY = "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";

    async function processAudio() {
        const fileInput = document.getElementById('audioFile');
        const btn = document.getElementById('btn');
        const status = document.getElementById('status');
        const output = document.getElementById('output');

        if (!fileInput.files || fileInput.files.length === 0) {
            alert('অনুগ্রহ করে একটি অডিও ফাইল বেছে নিন!');
            return;
        }

        const file = fileInput.files[0];

        btn.disabled = true;
        status.innerText = 'অডিও বিশ্লেষণ হচ্ছে... ৫-১০ সেকেন্ড সময় লাগতে পারে';
        output.value = '';

        const formData = new FormData();
        formData.append('file', file);
        formData.append('model', 'whisper-large-v3');
        formData.append('language', 'bn'); // বাংলা ভাষা ফিক্সড
        formData.append('response_format', 'json');

        try {
            const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: formData
            });

            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.error ? data.error.message : 'ট্রান্সক্রিপশনে ত্রুটি হয়েছে');
            }

            output.value = data.text;
            status.innerText = '✅ রূপান্তর সফল হয়েছে!';
        } catch (err) {
            status.innerText = '❌ রূপান্তর ব্যর্থ হয়েছে';
            alert('সমস্যা: ' + err.message);
        } finally {
            btn.disabled = false;
        }
    }

    function copyText() {
        const text = document.getElementById('output').value;
        if (!text.trim()) return alert('কপি করার মতো টেক্সট নেই!');
        navigator.clipboard.writeText(text);
        alert('টেক্সট কপি হয়েছে!');
    }

    function downloadText() {
        const text = document.getElementById('output').value;
        if (!text.trim()) return alert('ডাউনলোড করার মতো টেক্সট নেই!');
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `audio_text_${Date.now()}.txt`;
        a.click();
    }
</script>

</body>
</html>
